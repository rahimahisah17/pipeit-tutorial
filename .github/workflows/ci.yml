
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get my code
        uses: actions/checkout@v4

      - name: Run my checks
        run: bash tests/check.sh

      - name: Try my own action
        uses: ./.github/actions/build-card
        with:
          name: Rahimah Sulayman
